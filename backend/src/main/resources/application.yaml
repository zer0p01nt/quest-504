spring:
  application:
    name: quest504
  config:
    # Run bootRun from backend/. The repository-root .env uses properties syntax.
    import: "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  logging:
    level:
      org.hibernate.SQL: DEBUG

server:
  port: ${PORT:8080}
