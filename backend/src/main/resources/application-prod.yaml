spring:
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
